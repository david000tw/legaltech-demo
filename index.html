    // 第一審財產權訴訟裁判費：民事訴訟法第77條之13，並依第77條之27提高徵收（114/1/1 生效，司法院公告）
    // https://www.judicial.gov.tw/tw/cp-1654-2592-cc5cf-1.html
    // 100萬 → 13,200；1,000萬 → 118,500；1億 → 910,500；10億 → 7,840,500
    function calcCivilFee(amount) {
      const val = Math.max(0, Number(amount) || 0);
      if (val === 0) return 0;
      const units = Math.ceil(val / 10000); // 畸零之數不滿萬元者，以萬元計算
      if (units <= 10) return 1500; // 10萬元以下
      const brackets = [
        // [級距上限（萬元）, 每萬元費額]
        [100, 130],
        [1000, 117],
        [10000, 88],
        [100000, 77],
        [Infinity, 66]
      ];
      let fee = 1500;
      let prevCap = 10;
      for (const [cap, per10k] of brackets) {
        if (units <= prevCap) break;
        fee += (Math.min(units, cap) - prevCap) * per10k;
        prevCap = cap;
      }
      return fee;
    }

    // 以 UTC 計算日期，避免在台灣時區（UTC+8）用 toISOString 時少算一天
    function parseYmd(dateStr) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || "");
      return m ? [Number(m[1]), Number(m[2]) - 1, Number(m[3])] : null;
    }

    function addDays(dateStr, days) {
      const p = parseYmd(dateStr);
      if (!p) return "請輸入正確日期";
      return new Date(Date.UTC(p[0], p[1], p[2] + days)).toISOString().slice(0, 10);
    }

    // 只提示、不自動順延：補行上班日的週六不適用民法第122條順延，國定假日也需另查
    function weekendNote(dateStr) {
      const p = parseYmd(dateStr);
      if (!p) return "";
      const wd = new Date(Date.UTC(p[0], p[1], p[2])).getUTCDay();
      return wd === 0 || wd === 6
        ? "末日為週末：依民法第122條原則上順延至次一上班日，但補行上班日不適用，請核對當年行事曆。"
        : "";

                    className="text-xs px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer"

                    關閉
                  </button>
                </div>

                <div className="flex gap-2 text-xs">
                  <button
                    onClick={() => setExportMode("docx")}
                    className={`px-3 py-1.5 rounded-lg font-semibold border cursor-pointer ${
                      exportMode === "docx"
                        ? "bg-slate-900 text-white border-slate-900"
                        : "bg-slate-50 text-slate-700 border-slate-200"
                    }`}
                  >
                    標準 Word（.docx）排版規格
                  </button>
                  <button
                    onClick={() => setExportMode("efiling")}
                    className={`px-3 py-1.5 rounded-lg font-semibold border cursor-pointer ${
                      exportMode === "efiling"
                        ? "bg-slate-900 text-white border-slate-900"
                        : "bg-slate-50 text-slate-700 border-slate-200"
                    }`}
                  >
                    司法院線上起訴電子卷證打包清單
                  </button>
                </div>

                {exportMode === "docx" ? (
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2 leading-relaxed">
                    <div className="font-bold text-slate-900">
                      Word 匯出預設格式（可依事務所範本調整）：
                    </div>
                    <div>• 檔案名稱：民事起訴狀_林大明_v1.docx（分案後改以案號命名）</div>
                    <div>• 字體與級數：標楷體 14 級字（標題 18 級字粗體）</div>
                    <div>• 行距與邊界：固定行高 24pt，上下左右邊界各 2.5cm</div>
                    <div>• 附帶內容：文末自動附帶證物清單（原證 1 ～ 原證 {evidences.length}）</div>
                  </div>
                ) : (
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2 leading-relaxed">
                    <div className="font-bold text-slate-900">
                      司法院電子訴訟文書服務平台打包結構預覽：
                    </div>
                    <div className="font-mono bg-white p-3 rounded border border-slate-200 space-y-1 text-[11px]">
                      <div>01_民事起訴狀_主文.pdf</div>
                      <div>02_證物清單總表.pdf</div>
                      {evidences.map((ev, idx) => (
                        <div key={ev.id}>
                          {String(idx + 3).padStart(2, "0")}_{ev.id}_{ev.name.slice(0, 14)}.pdf
                        </div>
                      ))}
                    </div>
                    <p className="text-slate-600">
                      提醒：實際透過司法院線上起訴系統送出前，仍需由律師以自然人憑證或律師憑證完成簽章與確認。
                    </p>
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowExportModal(false)}
                    className="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold cursor-pointer"
                  >
                    完成預覽
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
