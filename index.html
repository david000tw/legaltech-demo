    // https://www.judicial.gov.tw/tw/cp-1654-2592-cc5cf-1.html
    // 100萬 → 13,200；1,000萬 → 118,500；1億 → 910,500；10億 → 7,840,500
    function calcCivilFee(amount) {
      const val = Math.max(0, Number(amount) || 0);
      if (val === 0) return 0;
      const units = Math.ceil(val / 10000); // 畸零之數不滿萬元者，以萬元計算
      if (units <= 10) return 1500; // 10萬元以下
      const brackets = [
        // [級距上限（萬元）, 每萬元費額]
        [100, 130],
        [1000, 117],
        [10000, 88],
        [100000, 77],
        [Infinity, 66]
      ];
      let fee = 1500;
      let prevCap = 10;
      for (const [cap, per10k] of brackets) {
        if (units <= prevCap) break;
        fee += (Math.min(units, cap) - prevCap) * per10k;
        prevCap = cap;
      }
      return fee;
    }

    // 以 UTC 計算日期，避免在台灣時區（UTC+8）用 toISOString 時少算一天
    function parseYmd(dateStr) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || "");
      return m ? [Number(m[1]), Number(m[2]) - 1, Number(m[3])] : null;
    }

    function addDays(dateStr, days) {
      const p = parseYmd(dateStr);
      if (!p) return "請輸入正確日期";
      return new Date(Date.UTC(p[0], p[1], p[2] + days)).toISOString().slice(0, 10);
    }

    function weekendNote(dateStr) {
      const p = parseYmd(dateStr);
      if (!p) return "";
      const wd = new Date(Date.UTC(p[0], p[1], p[2])).getUTCDay();
      return wd === 0 || wd === 6
        ? "末日為週末：依民法第122條原則上順延至次一上班日，但補行上班日不適用，請核對當年行事曆。"
        : "";
    }

                      </div>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-5 bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4">
                  <h3 className="font-bold text-base text-slate-900">
                    爭點整理表（準備程序參考）
                  </h3>

                  <div className="space-y-3 text-xs">
                    <div className="p-3.5 rounded-lg bg-emerald-50/70 border border-emerald-200">
                      <div className="font-bold text-emerald-900 mb-1">
                        一、兩造不爭執事項
                      </div>
                      <p className="text-slate-700 leading-relaxed">
                        1. 民國115年9月18日發生本件車禍，原告受有左側鎖骨閉鎖性骨折及右下肢擦挫傷，車輛受損。<br />
                        2. 原告已支付部分醫療與修車費用。
                      </p>
                    </div>

                    <div className="p-3.5 rounded-lg bg-rose-50/70 border border-rose-200">
                      <div className="font-bold text-rose-900 mb-1">
                        二、本件核心爭點
                      </div>
                      <p className="text-slate-700 leading-relaxed">
                        1. 被告就本件事故是否應負全部過失責任？原告有無與有過失？<br />
                        2. 車輛修復零件費應如何計算折舊？<br />
                        3. 原告請求休養6週薪資損失50,000元及精神慰撫金150,000元，是否為必要且相當？
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === "opponent" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-6 bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4">
                  <div>
                    <h3 className="font-bold text-base text-slate-900">
                      被告答辯狀重點拆解（勾選欲反駁項目）
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      系統比對我方起訴狀與卷證後，整理對造抗辯與因應說明
                    </p>
                  </div>

                  <div className="space-y-3">
                    {OPPONENT_POINTS.map((item) => {
                      const checked = selectedOppIds.includes(item.id);
                      return (
                        <label
                          key={item.id}
                          className={`block p-4 rounded-xl border cursor-pointer transition ${
                            checked
                              ? "bg-amber-50/60 border-amber-400"
                              : "bg-slate-50 border-slate-200"
                          }`}
                        >
                          <div className="flex items-start gap-2.5">
                            <input
                              type="checkbox"
                              checked={checked}
                              onChange={() =>
                                setSelectedOppIds((prev) =>
                                  prev.includes(item.id)
                                    ? prev.filter((x) => x !== item.id)
                                    : [...prev, item.id]
                                )
                              }
                              className="mt-1"
                            />
                            <div className="space-y-1.5 text-xs">
                              <div className="font-bold text-sm text-slate-900">
                                {item.tag}
                              </div>
                              <p className="text-slate-800 leading-relaxed">
                                <strong>對造主張：</strong>
                                {item.opponentClaim}
                              </p>
                              <p className="text-slate-600 leading-relaxed">
                                {item.systemAnalysis}
                              </p>
                            </div>
                          </div>
                        </label>
                      );
                    })}
                  </div>

                  <button
                    onClick={handleGenerateRebuttal}
                    className="w-full py-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold cursor-pointer"
                  >
                    產生「民事準備（一）狀」反駁草稿
                  </button>
                </div>

                <div className="lg:col-span-6 bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-3">
                  <h3 className="font-bold text-base text-slate-900">
                    準備書狀反駁草稿預覽
                  </h3>
                  <textarea
                    rows={20}
                    value={
                      generatedRebuttal ||
                      "請在左側勾選被告抗辯重點，並點擊「產生『民事準備（一）狀』反駁草稿」，系統將自動帶入卷證與實務說明產生初稿，供律師進一步修改。"
                    }
                    onChange={(e) => setGeneratedRebuttal(e.target.value)}
                    className="w-full p-3.5 text-xs leading-relaxed rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none focus:border-amber-500"
                  />
                </div>
              </div>
            )}

            {activeTab === "survey" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <div className="lg:col-span-7 space-y-5">
                  <section className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-5">
                    <div className="border-b border-slate-100 pb-2.5">
                      <h2 className="text-sm font-bold text-slate-900">
                        律師需求問卷（約 3 分鐘，每題點選即可）
                      </h2>
                      <p className="text-[11px] text-slate-500 mt-0.5">
                        用來決定第一版「攻、防、寫狀」要先解決哪一步。全部選填，再點一次可取消。
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">稱呼</label>
                        <input
                          type="text"
                          value={lawyerName}
                          onChange={(e) => setLawyerName(e.target.value)}
                          placeholder="例如：王律師"
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">事務所</label>
                        <input
                          type="text"
                          value={firmName}
                          onChange={(e) => setFirmName(e.target.value)}
                          placeholder="例如：○○法律事務所"
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">律師人數</label>
                        <select
                          value={firmSize}
                          onChange={(e) => setFirmSize(e.target.value)}
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-none focus:border-amber-500"
                        >
                          <option value="">請選擇</option>
                          {FIRM_SIZE_OPTIONS.map((s) => (
                            <option key={s} value={s}>
                              {s}
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">聯絡方式（願意試用時方便聯繫）</label>
                        <input
                          type="text"
                          value={contact}
                          onChange={(e) => setContact(e.target.value)}
                          placeholder="Email 或 LINE ID"
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-amber-500"
                        />
                      </div>
                    </div>

                    {SURVEY_QUESTIONS.map((q, i) => {
                      const current = surveyAnswers[q.id];
                      return (
                        <div key={q.id} className="space-y-2 text-xs">
                          <div className="font-semibold text-slate-800">
                            {i + 1}. {q.title}
                            {q.type === "multi" && <span className="font-normal text-slate-500">（可複選）</span>}
                          </div>
                          <div className="flex flex-wrap gap-2">
                            {q.options.map((opt) => {
                              const active = q.type === "multi" ? (current || []).includes(opt) : current === opt;
                              return (
                                <button
                                  key={opt}
                                  type="button"
                                  onClick={() => answerSurvey(q, opt)}
                                  className={`px-3 py-1.5 rounded-lg border font-medium cursor-pointer transition ${
                                    active
                                      ? "bg-slate-900 text-white border-slate-900"
                                      : "bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100"
                                  }`}
                                >
                                  {active ? `✓ ${opt}` : opt}
                                </button>
                              );
                            })}
                          </div>
                          {q.allowOther && (
                            <input
                              type="text"
                              value={surveyOther[q.id] || ""}
                              onChange={(e) => {
                                const value = e.target.value;
                                setSurveyOther((prev) => ({ ...prev, [q.id]: value }));
                              }}
                              placeholder="其他（選填）"
                              className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-amber-500"
                            />
                          )}
                        </div>
                      );
                    })}

                    <div className="space-y-1.5 text-xs">
                      <label className="block font-semibold text-slate-800">
                        {SURVEY_QUESTIONS.length + 1}. 其他想說的（選填）
                      </label>
                      <textarea
                        rows={3}
                        value={generalNote}
                        onChange={(e) => setGeneralNote(e.target.value)}
                        placeholder="例如：最希望系統先幫忙的一件事、對卷證保密的要求。"
                        className="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:border-amber-500 leading-relaxed"
                      />
                    </div>
                  </section>
                </div>

                <div className="lg:col-span-5 lg:sticky lg:top-5 bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-3">
                  <div className="flex items-center justify-between flex-wrap gap-2 border-b border-slate-100 pb-2.5">
                    <div>
                      <h2 className="text-sm font-bold text-slate-900">
                        即時產出的「需求確認摘要」
                      </h2>
                      <p className="text-[11px] text-slate-500 mt-0.5">
                        填寫完成後按「一鍵複製摘要」，用 LINE 或 Email 傳回給邀請您填寫的人
                      </p>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={handleCopy}
                        className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold cursor-pointer"
                      >
                        {copied ? "已複製 ✓" : "一鍵複製摘要"}
                      </button>
                      <button
                        onClick={() =>
                          handleDownload("律師訴訟需求確認.md", summaryMarkdown, "text/markdown;charset=utf-8")
                        }
                        className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold cursor-pointer"
                      >
                        .md
                      </button>
                      <button
                        onClick={() =>
                          handleDownload("lawyer-requirements.json", summaryJson, "application/json;charset=utf-8")
                        }
                        className="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold cursor-pointer"
                      >
                        .json
                      </button>
                    </div>
                  </div>

                  <pre className="p-3.5 rounded-lg bg-slate-900 text-slate-100 text-xs leading-relaxed whitespace-pre-wrap max-h-[680px] overflow-y-auto custom-scrollbar">
                    {summaryMarkdown}
                  </pre>
                </div>
              </div>
            )}
          </main>

          {showCalcModal && (
            <div className="fixed inset-0 bg-slate-950/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-base text-slate-900">
                    民事裁判費與法定期間試算
                  </h3>
                  <button
                    onClick={() => setShowCalcModal(false)}
                    className="text-xs px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer"
                  >
                    關閉
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">
                      訴訟標的金額（新臺幣 元）
                    </label>
                    <input
                      type="number"
                      value={calcAmount}
                      onChange={(e) => setCalcAmount(e.target.value)}
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-semibold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">
                        裁判／文書送達日
                      </label>
                      <input
                        type="date"
                        value={serviceDate}
                        onChange={(e) => setServiceDate(e.target.value)}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">
                        對造人數（推算繕本份數）
                      </label>
                      <input
                        type="number"
                        min={1}
                        value={copyCount}
                        onChange={(e) => setCopyCount(Math.max(1, Number(e.target.value) || 1))}
                        className="w-full px-3 py-2 rounded-lg border border-slate-300"
                      />
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-amber-50 border border-amber-200 space-y-1.5">
                    <div className="font-bold text-amber-950">試算結果參考：</div>
                    <div>
                      • 第一審裁判費預估：
                      <strong className="text-sm text-slate-900">
                        {firstInstanceFee.toLocaleString()} 元
                      </strong>
                    </div>
                    <div>
                      • 第二審裁判費預估（加徵十分之五）：
                      <strong className="text-sm text-slate-900">
                        {secondInstanceFee.toLocaleString()} 元
                      </strong>
                    </div>
                    <div>
                      • 若為判決送達，上訴 20 日期間屆滿日參考：
                      <strong className="text-slate-900">{addDays(serviceDate, 20)}</strong>
                      （實際須依假日順延及在途期間調整）
                      {weekendNote(addDays(serviceDate, 20)) && (
                        <div className="mt-1 text-rose-700 font-semibold">
                          ⚠ {weekendNote(addDays(serviceDate, 20))}
                        </div>
                      )}
                    </div>
                    <div className="text-[11px] text-slate-500">
                      費率依司法院公告（114/1/1 起依民事訴訟法第77條之27提高徵收）；刑事附帶民事訴訟經裁定移送民事庭者免納裁判費。
                    </div>
                    <div>
                      • 紙本遞狀建議準備：法院正本 1 份 ＋ 對造繕本 {copyCount} 份 ＋ 卷宗留存 1 份
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showExportModal && (
            <div className="fixed inset-0 bg-slate-950/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-base text-slate-900">
                    匯出書狀與司法院線上起訴卷證打包預覽
                  </h3>
                  <button
                    onClick={() => setShowExportModal(false)}
                    className="text-xs px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer"
                  >
                    關閉
                  </button>
                </div>

                <div className="flex gap-2 text-xs">
                  <button
                    onClick={() => setExportMode("docx")}
                    className={`px-3 py-1.5 rounded-lg font-semibold border cursor-pointer ${
                      exportMode === "docx"
                        ? "bg-slate-900 text-white border-slate-900"
                        : "bg-slate-50 text-slate-700 border-slate-200"
                    }`}
                  >
                    標準 Word（.docx）排版規格
                  </button>
                  <button
                    onClick={() => setExportMode("efiling")}
                    className={`px-3 py-1.5 rounded-lg font-semibold border cursor-pointer ${
                      exportMode === "efiling"
                        ? "bg-slate-900 text-white border-slate-900"
                        : "bg-slate-50 text-slate-700 border-slate-200"
                    }`}
                  >
                    司法院線上起訴電子卷證打包清單
                  </button>
                </div>

                {exportMode === "docx" ? (
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2 leading-relaxed">
                    <div className="font-bold text-slate-900">
                      Word 匯出預設格式（可依事務所範本調整）：
                    </div>
                    <div>• 檔案名稱：民事起訴狀_林大明_v1.docx（分案後改以案號命名）</div>
                    <div>• 字體與級數：標楷體 14 級字（標題 18 級字粗體）</div>
                    <div>• 行距與邊界：固定行高 24pt，上下左右邊界各 2.5cm</div>
                    <div>• 附帶內容：文末自動附帶證物清單（原證 1 ～ 原證 {evidences.length}）</div>
                  </div>
                ) : (
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2 leading-relaxed">
                    <div className="font-bold text-slate-900">
                      司法院電子訴訟文書服務平台打包結構預覽：
                    </div>
                    <div className="font-mono bg-white p-3 rounded border border-slate-200 space-y-1 text-[11px]">
                      <div>01_民事起訴狀_主文.pdf</div>
                      <div>02_證物清單總表.pdf</div>
                      {evidences.map((ev, idx) => (
                        <div key={ev.id}>
                          {String(idx + 3).padStart(2, "0")}_{ev.id}_{ev.name.slice(0, 14)}.pdf
                        </div>
                      ))}
                    </div>
                    <p className="text-slate-600">
                      提醒：實際透過司法院線上起訴系統送出前，仍需由律師以自然人憑證或律師憑證完成簽章與確認。
                    </p>
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setShowExportModal(false)}
                    className="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold cursor-pointer"
                  >
                    完成預覽
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
