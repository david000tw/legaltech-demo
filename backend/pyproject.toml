[project]
name = "legaltech-backend"
version = "0.1.0"
description = "台灣 AI 訴訟輔助系統後端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "itsdangerous>=2.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_ai: 會呼叫真的本機 Claude Code，預設不跑"]
addopts = "-m 'not real_ai'"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
